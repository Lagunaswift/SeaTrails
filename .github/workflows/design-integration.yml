name: design integration validation
on:
  push:
    branches: [feat/design-audits-and-integrity]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'Lagunaswift/SeaTrails' && github.ref == 'refs/heads/feat/design-audits-and-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-checked review patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/design-transfer/part-{i}.b64').read_text() for i in range(5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a3770fac5753ee023ded8651ccc4993612c0b1fa64cbf24d99e6923ec91a014c', 'Patch checksum mismatch'
          Path('/tmp/design.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/design.patch
          git apply --unidiff-zero /tmp/design.patch
          rm -rf .github/design-transfer
          rm .github/workflows/design-integration.yml
          git add -A
          test "$(git write-tree)" = '2070d732a632fea724d0594e52827e6ceb108f89'
      - name: Harness regression suite
        run: node skills/production-audit/scripts/run-tests.mjs
      - name: Registration consistency
        run: node .claude/skills/release-check/scripts/check-consistency.mjs
      - name: Preserve validated content on isolated branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git diff --cached --check
          tree=$(git write-tree)
          test "$tree" = '2070d732a632fea724d0594e52827e6ceb108f89'
          commit=$(printf '%s\n' 'Validate Impeccable and Taste audit integration' | git commit-tree "$tree" -p "$GITHUB_SHA")
          git push origin "$commit:refs/heads/feat/design-audits-and-integrity"
          echo "Validated tree: $tree"
          echo "Validated commit: $commit"
